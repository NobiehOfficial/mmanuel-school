<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mmanuel Junior School 2012 — Gulu, Uganda</title>
  <meta name="description" content="Mmanuel Junior School 2012 — a community junior school in Gulu, Uganda. Care, Respect, Responsibility.">

  <meta property="og:title" content="Mmanuel Junior School 2012">
  <meta property="og:description" content="A community junior school in Gulu, Uganda. Care, Respect, Responsibility.">
  <meta property="og:type" content="website">

  <link rel="icon" href="assets/logo.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="site-header" id="top">
    <div class="container header-inner">
      <a class="brand" href="#top">
        <img src="assets/logo.png" alt="" class="brand-logo" width="36" height="36">
        <span class="brand-text">
          <span class="brand-name" data-config="schoolName"></span>
          <span class="brand-sub">Junior School</span>
        </span>
      </a>

      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>

      <nav class="site-nav" id="site-nav" aria-label="Main">
        <ul data-nav></ul>
        <li class="nav-cta">
          <a class="btn btn-primary" href="#contact">Enquire</a>
        </li>
      </nav>
    </div>
  </header>

  <main>

    <!-- ============ HERO ============ -->
    <section class="hero" id="hero">
      <div class="hero-media" aria-hidden="true">
        <img data-config-src="images.hero" alt="" class="hero-img">
        <div class="hero-overlay"></div>
      </div>
      <div class="container hero-inner">
        <h1 class="hero-headline" data-config="hero.headline"></h1>
        <p class="hero-sub" data-config="hero.subheadline"></p>
        <div class="hero-ctas">
          <a class="btn btn-primary" data-config-href="hero.ctaPrimary.href" data-config="hero.ctaPrimary.label"></a>
          <a class="btn btn-whatsapp" data-config-href="hero.ctaSecondary.href" data-config="hero.ctaSecondary.label" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </section>

    <!-- ============ ABOUT ============ -->
    <section class="section" id="about">
      <div class="container about-grid">
        <div class="about-media">
          <img data-config-src="images.about" alt="" loading="lazy">
        </div>
        <div class="about-text">
          <span class="badge" data-config="about.badge"></span>
          <h2 class="section-title" data-config="about.heading"></h2>
          <div class="prose" data-about-body></div>
        </div>
      </div>
    </section>

    <!-- ============ STRENGTHS ============ -->
    <section class="section section-alt" id="strengths">
      <div class="container">
        <h2 class="section-title center">Why families choose us</h2>
        <div class="grid grid-3" data-strengths></div>
      </div>
    </section>

    <!-- ============ STAGES ============ -->
    <section class="section" id="stages">
      <div class="container">
        <h2 class="section-title center">Our stages</h2>
        <div class="grid grid-3" data-stages></div>
      </div>
    </section>

    <!-- ============ AWARDS ============ -->
    <section class="section section-alt" id="awards">
      <div class="container">
        <h2 class="section-title center">Our promise</h2>
        <div class="grid grid-3" data-awards></div>
      </div>
    </section>

    <!-- ============ PRINCIPAL MESSAGE ============ -->
    <section class="section" id="message">
      <div class="container message-grid">
        <div class="message-photo">
          <img data-config-src="images.principal" alt="" loading="lazy">
        </div>
        <div class="message-text">
          <h2 class="section-title" data-config="principal.heading"></h2>
          <blockquote class="quote" data-config="principal.quote"></blockquote>
          <p class="prose" data-config="principal.body"></p>
          <p class="signature">— <span data-config="principal.name"></span></p>
        </div>
      </div>
    </section>

    <!-- ============ TERM DATES ============ -->
    <section class="section section-alt" id="term-dates">
      <div class="container">
        <h2 class="section-title center">Term dates</h2>
        <div class="grid grid-3" data-terms></div>
      </div>
    </section>

    <!-- ============ TESTIMONIALS ============ -->
    <section class="section" id="stories">
      <div class="container">
        <h2 class="section-title center">Family stories</h2>
        <div class="grid grid-2" data-testimonials></div>
      </div>
    </section>

    <!-- ============ GALLERY ============ -->
    <section class="section section-alt" id="gallery">
      <div class="container">
        <h2 class="section-title center">Life at Mmanuel</h2>
        <div class="gallery-grid" data-gallery></div>
      </div>
    </section>

    <!-- ============ CONTACT / FORM ============ -->
    <section class="section" id="contact">
      <div class="container contact-grid">
        <div class="contact-info">
          <h2 class="section-title" data-config="form.heading"></h2>
          <p class="prose" data-config="form.subheading"></p>

          <ul class="contact-list">
            <li>
              <span class="label">Phone</span>
              <a data-config-href="contact.phoneHref" data-config="contact.phone"></a>
            </li>
            <li>
              <span class="label">WhatsApp</span>
              <a data-whatsapp-link target="_blank" rel="noopener">Message us on WhatsApp</a>
            </li>
            <li>
              <span class="label">Email</span>
              <a data-email-link data-config="contact.email"></a>
            </li>
            <li>
              <span class="label">Address</span>
              <span>
                <span data-config="contact.address.poBox"></span><br>
                <span data-config="contact.address.city"></span>,
                <span data-config="contact.address.country"></span>
              </span>
            </li>
          </ul>

          <div class="map-wrap">
            <iframe title="Map" data-map-embed loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>

        <form class="contact-form" data-form novalidate>
          <div class="field">
            <label for="parentName" data-config="form.fields.parentName"></label>
            <input id="parentName" name="parentName" type="text" required>
          </div>
          <div class="field">
            <label for="email" data-config="form.fields.email"></label>
            <input id="email" name="email" type="email" required>
          </div>
          <div class="field">
            <label for="phone" data-config="form.fields.phone"></label>
            <input id="phone" name="phone" type="tel">
          </div>
          <div class="field">
            <label for="studentName" data-config="form.fields.studentName"></label>
            <input id="studentName" name="studentName" type="text" required>
          </div>
          <div class="field">
            <label for="studentAge" data-config="form.fields.studentAge"></label>
            <input id="studentAge" name="studentAge" type="text">
          </div>
          <div class="field">
            <label for="message" data-config="form.fields.message"></label>
            <textarea id="message" name="message" rows="4"></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-block" data-config="form.submitLabel"></button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-about">
        <img src="assets/logo.png" alt="" width="32" height="32">
        <p data-config="footer.about"></p>
      </div>
      <div class="footer-cols" data-footer-cols></div>
    </div>
    <div class="container footer-legal">
      <p data-config="footer.legal.copyright"></p>
    </div>
  </footer>

  <!-- Floating WhatsApp button -->
  <a class="whatsapp-fab" data-whatsapp-link target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
      <path fill="currentColor" d="M19.55 4.91A9.82 9.82 0 0 0 12.54 2C7.08 2 2.63 6.45 2.63 11.91c0 1.75.46 3.45 1.32 4.95L2.55 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.91-7.01Z"/>
    </svg>
  </a>

  <script src="config.js"></script>
  <script src="config-detail.js"></script>
  <script src="script.js"></script>
</body>
</html>
